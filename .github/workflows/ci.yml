name: Build the examples

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install default JDK
        run: sudo apt-get update && sudo apt-get install -y default-jdk

      - name: Set JAVA_HOME environment variable
        run: echo "JAVA_HOME=$(readlink -f /usr/bin/java | sed 's:/bin/java::')" >> $GITHUB_ENV

      - name: Verify JAVA_HOME
        run: echo $JAVA_HOME

      - name: Build examples
        run: |
          make examples

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install giws
        run: python -m pip install .

      - name: Smoke-test the installed script
        run: |
          giws --version
          cd examples/basic_example
          giws -f MyComplexClass.giws.xml
          test -f basic_example.cpp
          test -f basic_example.hxx
