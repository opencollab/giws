name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install default JDK
        run: sudo apt-get update && sudo apt-get install -y default-jdk

      - name: Set JAVA_HOME environment variable
        run: echo "JAVA_HOME=$(readlink -f /usr/bin/java | sed 's:/bin/java::')" >> $GITHUB_ENV

      - name: Verify JAVA_HOME
        run: echo $JAVA_HOME

      - name: Build examples
        run: |
          make examples

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install giws
        run: python -m pip install . pytest

      - name: Run the test suite
        run: python -m pytest

      - name: Smoke-test the installed script
        run: |
          giws --version
          cd examples/basic_example
          giws -p -f MyComplexClass.giws.xml
          test -f basic_example.cpp
          test -f basic_example.hxx
